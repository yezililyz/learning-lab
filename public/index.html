<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Lab — workbook portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B1A1F;--ink2:#6E5A55;--paper:#FFFDFA;--wash:#FCF4EA;--lav:#F8E6D2;--line:#EED9C3;--violet:#B4520A;--violet-ink:#FFFFFF;--ok:#2E7D4F;--danger:#B42318;--brand2:#5B2333;--glyph:#F6B04B;
--serif:"Bitter",Georgia,"Times New Roman",serif;--sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F7ECE3;--ink2:#C7B2A6;--paper:#1C1416;--wash:#271C1D;--lav:#3A2824;--line:#4B3630;--violet:#F2A04E;--violet-ink:#1C1416;--ok:#7FCF9C;--danger:#FF8A80;--brand2:#F2A04E;--glyph:#1C1416;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#F7ECE3;--ink2:#C7B2A6;--paper:#1C1416;--wash:#271C1D;--lav:#3A2824;--line:#4B3630;--violet:#F2A04E;--violet-ink:#1C1416;--ok:#7FCF9C;--danger:#FF8A80;--brand2:#F2A04E;--glyph:#1C1416;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--sans)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--violet)}
h1,h2,h3,h4{font-family:var(--serif);line-height:1.2;margin:0 0 .4em;font-weight:600}
h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px}.h2{margin:36px 0 14px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.eyebrow{font-weight:600;color:var(--violet);margin:0 0 6px;font-size:15px}
.lead{font-size:19px;color:var(--ink2);max-width:62ch;margin:0 0 24px}
.hint{color:var(--ink2);font-size:14px;font-weight:400}
.meta-line{color:var(--ink2);font-size:14px;margin:6px 0}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:72px}
.logo{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;margin-right:auto}
.logo i{width:32px;height:32px;border-radius:50% 50% 50% 12px;background:var(--brand2);display:grid;place-items:center;color:var(--glyph);font-style:normal;font-size:16px}
.nav{display:flex;gap:6px}
.nav a{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--wash);color:var(--violet);text-decoration:none;font-weight:600;font-size:15px}
.nav a[aria-current="page"]{background:var(--violet);color:var(--violet-ink);border-color:var(--violet)}
#avatarBtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--lav);color:var(--violet);font:700 18px var(--serif);cursor:pointer}
#syncStatus{font-size:13px;color:var(--ink2);white-space:nowrap}
#syncStatus[data-state="synced"]::before{content:"● ";color:var(--ok)}
#syncStatus[data-state="error"]::before{content:"● ";color:var(--danger)}
main{padding:36px 0 80px}
/* cards & buttons */
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}
.btn{text-decoration:none;display:inline-block;font:600 15px var(--sans);border-radius:999px;padding:11px 20px;cursor:pointer;border:1.5px solid var(--violet);background:transparent;color:var(--violet)}
.btn.primary{background:var(--violet);color:var(--violet-ink)}
.btn.ghost{border-color:var(--line);background:var(--wash)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.saved{color:var(--ok);font-size:13px}
.bar{height:10px;background:var(--lav);border-radius:999px;overflow:hidden;margin-top:14px}
.bar.sm{height:7px}
.bar span{display:block;height:100%;background:var(--mc,var(--violet));border-radius:inherit;transition:width .3s}
/* profile */
.profile-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.welcome{margin-bottom:20px}
.avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.avatar-lg{width:92px;height:92px;border-radius:50%;background:var(--lav);color:var(--violet);display:grid;place-items:center;font:700 44px var(--serif);border:3px solid var(--line);flex:none}
.preview-card{background:var(--lav);border-color:transparent;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.preview-card .avatar-lg{background:var(--paper)}
.preview-card .stat{color:var(--violet);font-weight:700}
.pill{display:inline-block;background:var(--paper);color:var(--violet);border-radius:999px;padding:3px 12px;font-weight:600;font-size:14px}
.counter{display:block;text-align:right;font-size:13px;color:var(--ink2)}
.field{margin:0 0 20px}
.field.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label,.lbl{display:block;font-weight:700;margin-bottom:6px}
label .hint,.lbl .hint{display:block;font-weight:400;margin-top:1px}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--violet);outline:none;box-shadow:0 0 0 3px var(--lav)}
textarea{resize:vertical;min-height:84px}
.locked{opacity:.7}
/* catalog */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.mod-card{border-left:10px solid var(--mc);display:flex;flex-direction:column;margin:0}
.mod-card h2{font-size:21px;margin-top:10px}
.mod-card p{margin:0 0 6px}
.mod-card .actions{margin-top:auto;padding-top:14px}
.mod-top{display:flex;align-items:center;gap:10px}
.mod-icon{width:42px;height:42px;border-radius:12px;background:var(--wash);display:grid;place-items:center;font-size:22px;flex:none}
.mod-icon.xl{width:64px;height:64px;font-size:32px;border-radius:16px;background:var(--paper)}
.provider{font-size:14px;font-weight:600;color:var(--mc,var(--ink2));margin:0}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 18px}
.stat-card{margin:0;background:var(--wash);border-color:transparent}
.stat-card b{display:block;font:700 34px var(--serif);color:var(--violet)}
.stat-card small{font-size:18px;color:var(--ink2)}
.continue{display:flex;justify-content:space-between;align-items:center;gap:16px;border:2px solid var(--violet);background:var(--wash)}
.empty-card{text-align:center;padding:40px}
.activity{list-style:none;padding:0;margin:0;border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.activity li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.activity li:last-child{border-bottom:none}
.activity time{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.dot-c{width:10px;height:10px;border-radius:50%;flex:none}
/* journey */
.journey-row{border-left:10px solid var(--mc)}
.jr-head{display:flex;align-items:center;gap:14px}
.jr-head b{margin-left:auto;font:700 26px var(--serif);color:var(--mc)}
.jr-head h2{margin:0}
.tool-dots{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.tdot{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--paper)}
.tdot.part{background:linear-gradient(90deg,var(--mc) 50%,var(--paper) 50%);border-color:var(--mc)}
.tdot.done{background:var(--mc);border-color:var(--mc)}
/* module */
.mod-banner{background:color-mix(in srgb,var(--mc) 12%,var(--paper));padding:24px 0 26px;margin:-36px 0 28px;border-bottom:1px solid var(--line)}
.crumb{font-weight:600;text-decoration:none;display:inline-block;margin-bottom:14px}
.mb-row{display:flex;gap:16px;align-items:center}
.mb-row h1{margin:0}
.mod-banner .bar span{background:var(--mc)}
.notice{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0 0;padding:14px 18px}
.mod-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
.mod-nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);max-height:calc(100vh - 110px);overflow:auto;padding-right:6px}
.mn-group{font-weight:700;font-size:14px;color:var(--ink2);margin:16px 0 4px}
.mn-link{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:15px}
.mn-link:hover{background:var(--wash)}
.mn-link.on{background:var(--lav);color:var(--violet);font-weight:600}
.mn-link.brief{margin-top:14px;border:1.5px dashed var(--line)}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.part{border-color:var(--violet);background:linear-gradient(90deg,var(--violet) 50%,transparent 50%)}
.dot.done{background:var(--ok);border-color:var(--ok)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0 0 18px}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);grid-row:span 2;width:32px;height:32px;border-radius:50%;background:var(--violet);color:var(--violet-ink);display:grid;place-items:center;font:700 15px var(--serif)}
.steps span{color:var(--ink2)}
.howto{background:var(--wash);border-radius:14px;padding:14px 18px;margin-bottom:18px}
.howto p{margin:6px 0}
.glossary summary{cursor:pointer;font:600 19px var(--serif)}
.glossary dl{margin:14px 0 0;columns:2 320px;column-gap:28px}
.glossary dt{font-weight:700;color:var(--violet);break-after:avoid}
.glossary dd{margin:2px 0 14px;color:var(--ink2);break-inside:avoid}
.sheet .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-bottom:10px}
.ref{background:var(--wash);border-radius:999px;padding:2px 10px}
.tool-title{font-size:28px}
.intro{color:var(--ink2);font-size:18px;margin:0 0 18px}
.tip{border-left:4px solid var(--violet);background:var(--wash);border-radius:0 14px 14px 0;padding:12px 16px;margin:0 0 22px}
.tip p{margin:4px 0 0}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;cursor:pointer}
.chk:has(input:checked){border-color:var(--violet);background:var(--wash)}
.chk input{margin-top:4px;accent-color:var(--violet)}
.customs{display:grid;gap:8px;margin-top:8px}
.listin{margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{font-weight:600;margin:0;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:15px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--violet);border-color:var(--violet);color:var(--violet-ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--violet);outline-offset:2px}
.rate-row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.rate-row>span{flex:1}
.sec{font-size:17px;margin:18px 0 4px;color:var(--violet)}
.score{display:flex;gap:16px;align-items:center;background:var(--lav);border-radius:14px;padding:14px 18px;margin-top:16px}
.score>b{font:700 30px var(--serif);color:var(--violet);white-space:nowrap}
.ab{display:grid;grid-template-columns:32px 1fr 1fr;gap:8px;margin-bottom:8px;align-items:stretch}
.ab .n{font:700 16px var(--serif);color:var(--ink2);padding-top:12px}
.ab label{font-weight:400;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;cursor:pointer;display:flex;gap:8px}
.ab label:has(input:checked){border-color:var(--violet);background:var(--wash);font-weight:600}
.ab input{accent-color:var(--violet);margin-top:5px}
.range-row{display:grid;grid-template-columns:1fr 200px 32px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.range-row input{accent-color:var(--violet)}
output{font-weight:700;color:var(--violet);text-align:right}
.tbl-wrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}
.grid th{text-align:left;font-size:13px;color:var(--ink2);padding:8px;background:var(--wash);white-space:nowrap}
.grid td{padding:4px;border-top:1px solid var(--line);min-width:110px}
.grid td input,.grid td select{border-radius:8px;padding:7px 8px}
.grid .rowlab{font-weight:600;font-size:14px;padding:8px;min-width:120px}
.grid .comp{font-weight:700;color:var(--violet);padding:8px;white-space:nowrap}
.numin{max-width:90px}
.foot{font-weight:600;color:var(--violet);margin:8px 0 0}
.statement{font-family:var(--serif);font-size:19px;line-height:1.6;background:var(--wash);border-radius:14px;padding:16px 18px;margin:4px 0 16px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.brief .q{font-weight:700;margin:14px 0 2px}
.brief .a{margin:0 0 8px;white-space:pre-wrap}
.brief h3.bsec{margin-top:30px;padding-top:14px;border-top:2px solid var(--line);color:var(--violet)}
.brief h4{font-size:18px;margin:18px 0 4px}
.btable th,.btable td{text-align:left;padding:7px 10px;border-top:1px solid var(--line);font-size:15px;vertical-align:top}
.btable th{background:var(--wash);font-size:13px}
.bar-row{display:grid;grid-template-columns:1fr 160px 28px;gap:10px;align-items:center;margin:4px 0}
.bar-row i{height:8px;background:var(--lav);border-radius:999px;overflow:hidden}
.bar-row i span{display:block;height:100%;background:var(--violet)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:30;font-weight:600}
#toast.show{opacity:1;transform:translate(-50%,0)}
body.auth .nav,body.auth #avatarBtn,body.auth #syncStatus{display:none}
.auth-wrap{display:grid;place-items:center;min-height:72vh}
.auth-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:48px;align-items:center;width:100%}
.auth-brand h1{font-size:clamp(30px,4vw,44px);max-width:14ch}
.auth-points{padding:0;margin:20px 0;list-style:none}.auth-points li{padding:8px 0 8px 30px;position:relative}
.auth-points li::before{content:"";position:absolute;left:0;top:14px;width:14px;height:14px;border-radius:50% 50% 50% 4px;background:var(--violet)}
.auth-card{width:100%;padding:32px}
.role-seg{margin-bottom:18px}.role-seg label{flex:1;text-align:center}
.or{display:flex;align-items:center;gap:12px;color:var(--ink2);margin:20px 0;font-size:14px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.acct-wrap{position:relative}
.acct-menu{position:absolute;right:0;top:50px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:12px;min-width:230px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 12%,transparent);z-index:40}
.acct-menu p{margin:0 0 8px;font-size:14px;word-break:break-all}
.acct-menu a,.acct-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font:600 15px var(--sans);color:var(--ink);text-decoration:none;background:none;border:none;cursor:pointer}
.acct-menu a:hover,.acct-menu button:hover{background:var(--wash)}
@media (max-width:900px){.auth-split{grid-template-columns:1fr;gap:20px}.auth-points,.auth-brand .hint{display:none}}
.logo.big{margin-bottom:22px}
.btn.wide{width:100%}
.err{color:var(--danger);font-weight:600;min-height:1em;margin:0 0 10px}
.proto{background:var(--lav);border-left:4px solid var(--brand2);border-radius:12px;padding:10px 14px;font-size:14px;margin:14px 0}
.mail-mock{border:1.5px solid var(--line);border-radius:14px;padding:18px;background:var(--wash);margin:18px 0}
.mm-head{font-size:14px;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:10px}
.account{margin-top:16px}.chk.demo{margin-top:12px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 22px;border-bottom:1.5px solid var(--line)}
.tabs a{padding:10px 16px;text-decoration:none;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs a[aria-current="page"]{color:var(--violet);border-color:var(--violet)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.admin-table td{vertical-align:middle}.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn.sm{padding:6px 12px;font-size:14px}
.mod-icon.sm{display:inline-grid;width:28px;height:28px;font-size:15px;border-radius:8px;vertical-align:middle}
.status{border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--wash)}
.status.published{color:var(--ok)}.status.draft{color:#9A6700}.status.hidden{color:var(--ink2)}
.up-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--line);border-radius:16px;padding:28px;margin:16px 0;cursor:pointer;text-align:center}
.drop.over{border-color:var(--violet);background:var(--wash)}.drop input{position:absolute;opacity:0;width:1px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.ref-card dl{margin:0}.ref-card dt{margin-top:10px}.ref-card dd{margin:2px 0 0;color:var(--ink2);font-size:14px}.ref-card h3{font-size:16px;margin:18px 0 4px}
code{background:var(--wash);border-radius:6px;padding:1px 5px;font-size:13px}
.val{border-radius:14px;padding:14px 18px;margin-top:16px}.val.bad{background:color-mix(in srgb,var(--danger) 10%,var(--paper))}.val.good{background:color-mix(in srgb,var(--ok) 10%,var(--paper))}
.val ul{margin:8px 0 0;padding-left:20px}.warn{color:#9A6700}
.linkcell code{word-break:break-all}
.pct{display:inline-block;width:60px;height:6px;background:var(--lav);border-radius:999px;overflow:hidden;vertical-align:middle}.pct i{display:block;height:100%}
@media (max-width:900px){.up-grid{grid-template-columns:1fr}}
@media (max-width:900px){.mod-layout,.profile-grid{grid-template-columns:1fr}.mod-nav{position:static;max-height:none;border:1.5px solid var(--line);border-radius:16px;padding:10px}.stats{grid-template-columns:1fr}}
@media (max-width:700px){.top .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px}.nav{order:3;width:100%;overflow-x:auto}#syncStatus{display:none}.field.two{grid-template-columns:1fr}.ab{grid-template-columns:24px 1fr}.ab label:last-child{grid-column:2}.range-row{grid-template-columns:1fr 32px}.range-row input{grid-column:1/-1;grid-row:2}.rate-row{flex-direction:column;align-items:flex-start}.continue{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.mod-nav,.mod-banner,.noprint,.glossary,#toast{display:none!important}.mod-layout{display:block}.card{border:none;padding:0}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="#dashboard" class="logo"><i aria-hidden="true">✎</i>Learning Lab</a>
  <span id="syncStatus" data-state="local">Saved in this browser</span>

    T("risks","The four big risks","Study guide p. 7","Rate how exposed your idea is to each risk.",[
      {k:"idea",type:"text",label:"Idea or initiative"},
      {k:"rates",type:"ratelist",items:["Value risk","Usability risk","Feasibility risk","Business viability risk"],options:["Low","Medium","High"]},
      {k:"plan",type:"textarea",label:"How will you reduce the highest risk?"}]),
    T("questions","Interview guide","Study guide pp. 7–8","Pick the discovery questions you’ll use, and add your own.",[
      {k:"who",type:"text",label:"Who will you interview?"},
      {k:"qs",type:"checklist",options:["What is your role and your most important tasks?","What are your current pain points?","How do you currently solve these pain points or needs?","What are the biggest challenges you encounter when trying to achieve X?","What would an ideal solution look like from your perspective?","How easy is our product to use?","Are there any features you wish the product had?","If you could change one thing about our product, what would it be?","Are there any features that you don’t find valuable or rarely use?","How has our product helped improve your business outcomes?"],custom:3}],
      "Open-ended, non-leading, focused on pain points, asking for specific examples, aware of context."),
    T("ost","Opportunity solution tree","Study guide p. 8","Map the paths from a desired outcome to opportunities, solutions and tests.",[
      {k:"outcome",type:"text",label:"Desired outcome"},
      {k:"rows",type:"table",cols:["Opportunity","Solution","Assumption test"],rows:6}]),
    T("assumptions","Assumption map","Study guide p. 8","Plot each assumption by importance and certainty.",[
      {k:"rows",type:"table",rows:6,cols:["Assumption",{name:"Importance",opts:["High","Low"]},{name:"Certainty",opts:["Known","Unknown"]}],computeLabel:"Next move",
        compute:r=>{const i=r[1],c=r[2]; if(!i||!c) return ""; return i==="High"?(c==="Unknown"?"Test first":"Proceed"):(c==="Unknown"?"Monitor":"Deprioritise");}}]),
    T("rice","RICE scoring","Study guide p. 8","Reach × Impact × Confidence ÷ Effort. Enter confidence as a percentage.",[
      {k:"rows",type:"table",rows:6,cols:["Solution",{name:"Reach",num:1},{name:"Impact",num:1},{name:"Confidence %",num:1},{name:"Effort",num:1}],computeLabel:"Score",
        compute:r=>{const R=num(r[1]),I=num(r[2]),C=num(r[3]),E=num(r[4]); return [R,I,C,E].every(Number.isFinite)&&E>0?(R*I*(C/100)/E).toFixed(1):"";}}],
      "Keep units consistent: reach per quarter, impact on a 0.25–3 scale, effort in person-months.")
   ]},
   {name:"Data-driven tactics & scaling", tools:[
    T("data","Data-driven discovery checklist","Study guide pp. 13–14","Tick the data sources you’re using for this discovery effort.",[
      {k:"used",type:"checklist",options:["User interviews","In-app surveys","Competitive research","Proactive feedback via in-app guides","Always-on in-app feedback portal","Funnels","Paths","Session replay","Number of users experiencing friction","ARR associated with those accounts","Discovery dashboards","Smoke tests (fake door)","Prototyping","A/B testing","Usability testing"],custom:1},
      {k:"ai",type:"textarea",label:"Where could AI speed this up?"}]),
    T("audit","Discovery practice audit","Study guide pp. 6–11","Be honest about the mistakes, gaps and biases in your team’s discovery today.",[
      {k:"mistakes",type:"ratelist",label:"Common mistakes",items:["Excluding engineers or designers","Jumping to solutions before nailing the problem","Only doing discovery pre-launch","Researching to validate existing assumptions","Skipping quantitative data"],options:["Not us","Sometimes","Often"]},
      {k:"gaps",type:"ratelist",label:"Gaps",items:["Systematic gaps","Skill gaps","Insight gaps"],options:["None","Some","Big"]},
      {k:"biases",type:"ratelist",label:"Biases",items:["Confirmation bias","Bandwagon effect","Authority bias"],options:["Rarely","Sometimes","Often"]},
      {k:"change",type:"textarea",label:"One change I’ll make"}]),
    T("exam","Exam readiness","Study guide p. 4","20 multiple-choice questions, 60 minutes, 75% to pass, open book.",[
      {k:"conf",type:"sliders",items:["Why we need to get discovery right (20%)","Discovery fundamentals (30%)","Data-driven tactics (30%)","Scaling discovery (20%)"]},
      {k:"gaps",type:"textarea",label:"Concepts to revisit"}])
   ]}]

{ id:"pl", title:"Product-led Certification", provider:"Pendo × Mind the Product", color:"#C2410C", icon:"🚀",
  blurb:"Put the product at the centre of every function: Jobs to be Done, data stack, launch plans, feedback policy and customer health scoring.",
  time:"6 lessons · exam: 30 questions, 90 min, 75% to pass",
  steps:[
    ["Start with the job","Do Jobs to be Done first. Every later exercise (metrics, launch, health score) should serve that job."],
    ["Pick one goal for the data stack","e.g. improve retention or reduce tickets. Then choose metrics from the 10 product-led KPIs."],
    ["Plan a real launch","Use an upcoming feature. Measure breadth, time to adopt and duration of adoption, not just usage."],
    ["Operationalise","Write the feedback policy, then a first health score. Both are meant to evolve: iterate as you learn."]],
  glossary:[
    ["Product-led organization","A business that makes its product the vehicle for acquiring and retaining customers, driving growth and influencing priorities. Broader than product-led growth: sales, marketing, education and support all converge inside the product."],
    ["Six characteristics","Align every function around the product; decide with data; use the product as a marketing channel; amazing onboarding; help users help themselves; collect and use feedback."],
    ["Jobs to be Done (JTBD)","Why customers “hire” your product. Main and related jobs each have functional aspects (utility) and emotional aspects, split into personal (how they feel) and social (how others see them) dimensions. TurboTax: main job = complete a tax return."],
    ["Net revenue retention (NRR)","Revenue kept from existing customers over a period: expansion minus downsell and churn. Healthy products aim above 100%."],
    ["Stickiness","How often users return: DAU/MAU, DAU/WAU or WAU/MAU, chosen to match how often the product should be used."],
    ["Product Engagement Score (PES)","The average of adoption, stickiness and growth: one number for engagement, easy to decompose."],
    ["Time to value · aha moment","How long until a new user gets value. Slack’s 2,000 messages and Facebook’s 7 friends in 10 days are famous aha thresholds."],
    ["NPS","% promoters (9–10) minus % detractors (0–6). Benchmark against yourself over time, by account and by user."],
    ["Feature adoption: breadth, time, duration","How widely a feature is used, how quickly users try it, and whether they keep using it. All three matter."],
    ["Product feedback policy","A short document telling customers where to submit feedback, how often it’s reviewed and how they’ll hear back."],
    ["Product Ops","The function between product, engineering and customer success that tightens feedback loops, systematises launches and scales product knowledge."],
    ["PQL vs MQL","Product-qualified leads have experienced value in the product (trial, freemium); marketing-qualified leads have only consumed marketing."],
    ["Freemium vs trial","Freemium gives part of the product free indefinitely; a trial gives all of it for a limited time. Trials convert more, freemium keeps prospects around."],
    ["Customer health score","A weighted mix of signals (adoption, support, sentiment, purchasing) that flags who needs attention. Rapid7 started with adoption 40%, support 35%, purchasing 25%."]],
  groups:[
   {name:"Exercises", tools:[
    T("jtbd","Identify your Jobs to be Done","Workbook, Module 2","Define why people use your product, then break the job into its functional and emotional sides.",[
      {k:"main",type:"textarea",label:"Main Job to be Done"},
      {k:"functional",type:"textarea",label:"Functional aspects",hint:"2–4"},
      {k:"emotional",type:"textarea",label:"Emotional aspects",hint:"2–4"},
      {k:"personal",type:"textarea",label:"Personal dimensions"},
      {k:"social",type:"textarea",label:"Social dimensions"},
      {k:"related",type:"list",label:"Related Jobs to be Done",count:5,numbered:true},
      {k:"reflect",type:"textarea",label:"How does this map to the solution you offer today?"}],
      "Ask customers, not just your team, and don’t settle for answers that validate the status quo."),
    T("data","Define your data stack","Workbook, Module 3","Start from one goal, list your data sources and what they track, then settle on decision metrics.",[
      {k:"goal",type:"text",label:"Goal or Job to be Done"},
      {k:"sources",type:"table",cols:["Data source","Metrics it tracks"],rows:6},
      {k:"final",type:"list",label:"Final metrics, ranked",count:5,numbered:true}],
      "Start from questions (“Are new users trying the feature?”), then pick metrics that answer them, rather than starting from a metric list."),
    T("launch","Launch plan that accelerates adoption","Workbook, Module 4","What success looks like, how you’ll communicate, and how you’ll hear back.",[
      {k:"feature",type:"text",label:"Feature being launched"},
      {k:"goals",type:"table",cols:["Goal"],rows:3,rowLabels:["30 days","60 days","90 days"]},
      {k:"comms",type:"table",cols:["Audience","Channel","Level of detail"],rows:5},
      {k:"feedback",type:"textarea",label:"How will you collect customer feedback?"},
      {k:"improve",type:"textarea",label:"How will you use data and feedback after launch?"}],
      "Target announcements to the users the feature is relevant to, and give one clear next action (try it, read the doc, give feedback)."),
    T("policy","Customer feedback policy","Workbook, Module 4","Document the five parts of your feedback policy.",[
      {k:"approach",type:"textarea",label:"Your approach to product feedback"},
      {k:"how",type:"textarea",label:"How customers can provide feedback"},
      {k:"after",type:"textarea",label:"What happens to feedback"},
      {k:"faqs",type:"textarea",label:"FAQs"},
      {k:"share",type:"textarea",label:"Sharing your policy"}],
      "Four steps behind it: one place for feedback, a transparent review process, communicating back, and getting sales and CS on board."),
    T("health","Customer health scoring model","Workbook, Module 6","Turn signals into a health score and decide what to do for each type of customer.",[
      {k:"signals",type:"textarea",label:"Every metric that might signal health"},
      {k:"groups",type:"list",label:"Groups of metrics (score components)",count:6,numbered:true},
      {k:"initial",type:"textarea",label:"Initial components",hint:"3–4 you can use with today’s data"},
      {k:"medium",type:"textarea",label:"Medium-term components"},
      {k:"long",type:"textarea",label:"Long-term components"},
      {k:"weights",type:"table",rows:5,cols:["Initial component",{name:"Weight %",num:1}],
        footer:rows=>{const s=rows.reduce((a,r)=>a+(Number.isFinite(num(r?.[1]))?num(r[1]):0),0); return s?`Total: ${s}%${s===100?" — balanced":" — adjust to reach 100%"}`:"";}},
      {k:"healthy",type:"textarea",label:"Plan for healthy customers"},
      {k:"neutral",type:"textarea",label:"Plan for neutral customers",hint:"Rapid7’s lesson: this is where extra attention pays off most"},
      {k:"unhealthy",type:"textarea",label:"Plan for unhealthy customers"}]),
    T("exam","Exam readiness","Study guide","30 multiple-choice questions, 90 minutes, 75% to pass, open book.",[
      {k:"conf",type:"sliders",items:["Fundamentals of being product led (20%)","Leveraging data (16%)","Delivering products differently (12%)","Driving customer success (16%)","Marketing and selling for growth (20%)","Implementing at your organization (16%)"]},
      {k:"gaps",type:"textarea",label:"Concepts to revisit"}])
   ]}]
},

{ id:"rpt", title:"Radical Product Thinking: Vision", provider:"Radical Product × Pendo", color:"#B8862B", icon:"🎯",
  blurb:"Write a radical vision statement that acts as a filter, diagnose product diseases, and use vision fit vs. survival to prioritise.",
  time:"6 modules · quiz: 15 questions, 60 min, 75% to pass",
  steps:[
    ["Diagnose before you write","Run the product disease check. It tells you why your team needs a sharper vision and helps get buy-in."],
    ["Write the source code, not a tagline","Fill in who, what, why, when and how. Ask “so what?” on the why until it resonates for you and your customers."],
    ["Translate into strategy and priorities","Use RDCL, then place real backlog items on vision fit vs. survival."],
    ["Use it every week","Bring it into sprint planning and stakeholder conversations. Review it monthly in a startup, quarterly or half-yearly in a mature product."]],
  glossary:[
    ["Product vision","A statement of the overarching purpose of your product. In RPT it’s the “source code”: detailed and specific; marketing can write the tagline later."],
    ["A vision as a filter","A good vision lets you hold up a feature and sometimes say “no, don’t do it”. Big, broad visions (“contributing to human progress”) filter nothing."],
    ["Three qualities","Centered on the problem (not your aspirations), shared by your team and customers, and helps you visualise a concrete end state."],
    ["Who · What · Why · When · How","Whose world you change; what their problem looks like today; why the status quo is unacceptable; what the world looks like when it’s solved; how your product brings it about."],
    ["The “so what?” test","Keep asking “so what?” about your why until the answer resonates deeply, as with Pendo’s Michelle Grupinski revising her vision."],
    ["Three pillars","Your product is your mechanism for change; envision the change clearly first; then systematically engineer it."],
    ["Elements of RPT","Vision → strategy → prioritization → execution and measurement → culture, with plenty of back-and-forth."],
    ["RDCL strategy","Real pain points, Design (the solution), Capabilities (what you need to build it) and Logistics (how you deliver and charge for it)."],
    ["Vision fit vs. survival","Ideal (good for both), Investing in the vision (long-term good, short-term costly, e.g. user research), Vision debt (helps survival, hurts vision, e.g. a custom feature for a big deal) and Danger (bad for both)."],
    ["Product diseases","Pivotitis, Strategic Swelling, Narcissus Complex, Obsessive Sales Disorder, Hero Syndrome, Hypermetricemia and Locked-In Syndrome."],
    ["Hippocratic Oath of product","Builders must take responsibility for users’ wellbeing and bake it into vision, strategy, priorities and metrics, as Lijjat did by measuring women given financial independence."]],
  groups:[
   {name:"Vision", tools:[
    T("diseases","Product disease check","Study guide p. 9","Diagnose which product diseases your product shows.",[
      {k:"rates",type:"ratelist",items:["Hero Syndrome — scale over real impact","Strategic Swelling — too much for too many users","Hypermetricemia — obsession with metrics","Narcissus Complex — focused on our own needs","Obsessive Sales Disorder — features for one customer","Locked-In Syndrome — committed to a platform, not a problem","Pivotitis — rapid, frequent changes in direction"],options:["Absent","Mild","Severe"]},
      {k:"treat",type:"textarea",label:"Which one will you treat first, and how?"}]),
    T("vision","Radical vision statement","Study guide p. 10","Fill in each part; your statement builds itself below.",[
      {k:"who",type:"text",label:"Who · Today, when…",hint:"A specific group, not everyone"},
      {k:"outcome",type:"text",label:"What · …want to…",hint:"What they want to accomplish, not the task (get reimbursed, not file an expense report)"},
      {k:"current",type:"text",label:"What · …they have to…",hint:"Their current activity or solution"},
      {k:"why",type:"text",label:"Why · This is unacceptable, because…",hint:"Ask “so what?” a few times"},
      {k:"when",type:"text",label:"When · We envision a world where…",hint:"No fluff words like revolutionise or democratise"},
      {k:"how",type:"text",label:"How · We’re bringing this world about through…",hint:"Only now describe your product"},
      {k:"preview",type:"preview",render:a=>visionSentence(a)||"Your statement appears here as you fill in the parts."},
      {k:"test",type:"checklist",label:"Does it pass the three qualities?",options:["It’s centered on the problem","It’s shared by the team and customers","It helps visualize a concrete end state"],custom:0}],
      "It’s fine if it reads like a short essay. Radhika’s TV ad sales vision was “uninspiring” and still aligned the team because it was authentic.")
   ]},
   {name:"Strategy & use", tools:[
    T("rdcl","RDCL strategy","Study guide p. 7","Translate the vision into strategy.",[
      {k:"r",type:"textarea",label:"Real pain points · What’s the user’s pain?"},
      {k:"d",type:"textarea",label:"Design · What does our solution look like?"},
      {k:"c",type:"textarea",label:"Capabilities · How do we enable those capabilities?"},
      {k:"l",type:"textarea",label:"Logistics · How do we deliver it?"}],
      "Personas you left out of the who (e.g. sellers in a buyer-focused marketplace) get addressed here."),
    T("prioritize","Vision fit vs. survival","Study guide p. 7","Place each initiative on the two axes to see its quadrant.",[
      {k:"rows",type:"table",rows:6,cols:["Initiative",{name:"Vision fit",opts:["Good","Poor"]},{name:"Survival",opts:["Improves","Worsens"]}],computeLabel:"Quadrant",
        compute:r=>{const f=r[1],s=r[2]; if(!f||!s) return ""; return f==="Good"?(s==="Improves"?"Ideal":"Investing in the vision"):(s==="Improves"?"Vision debt":"Danger");}},
      {k:"debt",type:"textarea",label:"How will you pay down any vision debt?"}],
      "Use it visually with sales: a custom feature in Vision debt next to an Ideal item makes the trade-off less contentious."),
    T("apply","Use your vision","Study guide p. 8","Put the vision to work in everyday decisions.",[
      {k:"rethink",type:"choice",label:"Do you need to rethink the vision?",options:["No","Market changed","Low traction or decline","Product diseases"]},
      {k:"align",type:"textarea",label:"How will you align the team on it?",hint:"Early buy-in, a group exercise, an external facilitator, or an indirect approach"},
      {k:"sprint",type:"textarea",label:"Sprint planning"},
      {k:"comms",type:"textarea",label:"Communication with stakeholders"},
      {k:"strategy",type:"textarea",label:"Strategic planning"}]),
    T("exam","Quiz readiness","Study guide p. 4","15 multiple-choice questions, 60 minutes, 75% to pass, open book.",[
      {k:"conf",type:"sliders",items:["Intro to the RPT methodology (33%)","What makes a good vision statement (20%)","Breaking down real vision statements (20%)","How to use your vision statement (27%)"]},
      {k:"gaps",type:"textarea",label:"Concepts to revisit"}])
   ]}],
  highlights:A=>[["My radical vision",visionSentence(A("vision"))]]
},

{ id:"bg", title:"Buying Product Experience Software", provider:"Pendo buyer’s guide", color:"#4F6D7A", icon:"🧾",
  blurb:"Build the business case for a product experience tool: outcomes, ROI, stakeholder objections and a center of excellence.",
  time:"4 chapters · about 2 hours",
  steps:[

      {k:"roles",type:"table",rows:4,rowLabels:["Project lead","Department lead","Technical lead","Methodology lead"],cols:["Who","First responsibility"]},
      {k:"launch",type:"checklist",label:"Launch checklist",options:["Prepare a COE communication plan","Sustain engagement with internal customers","Share business impact","Run regular surveys"],custom:0}])
   ]}]
},

{ id:"lead", title:"Leadership Exercise Workbook", provider:"SITMI", color:"#7A4B2A", icon:"🌱",
  blurb:"14 exercises on self-awareness, business acumen, strategic thinking, communication, and the traits that make leaders trusted.",
  time:"14 exercises · two 10-day practices",
  steps:[
    ["Self-awareness first","Do exercises 1–3 together: reflection, 360° feedback and personality tests, then synthesise strengths and weaknesses."],
    ["Know the business","Answer the business acumen questions honestly. If you can’t answer half, pause and learn before moving on."],
    ["Practise daily for 10 days","Exercises 7 and 8 are habits. Log one row per day."],
    ["Score, then act","The trait self-checks score automatically. Turn your lowest areas into a 30-day plan."]],
  glossary:[
    ["360° feedback","Feedback from your manager, peers, customers and team on the same questions. Anonymous surveys get more honest answers."],
    ["Perception gap","The difference between how you rate yourself and how others rate you. The largest gaps are where to focus first."],
    ["Business acumen","Understanding how your company makes money, competes and measures success: revenue, margin, profit, ROI and cash flow."],
    ["Strategic thinking","Connecting today’s tasks to tomorrow’s trends and leadership priorities, and acting before being asked."],
    ["Accountability","Ownership + initiative + integrity: following through, admitting mistakes and owning team outcomes."],
    ["Psychological safety","A shared belief that people won’t be punished for speaking up, asking questions or making mistakes."],
    ["Thomas-Kilmann model","Five conflict styles (competing, collaborating, compromising, avoiding, accommodating) used to explore your default approach."],
    ["Pause – Listen – Clarify – Resolve","A structured approach for tense discussions recommended for “strong but growing” conflict handlers."]],
  groups:[
   {name:"Self-awareness", tools:[
    T("ex1","Your own reflection","Exercise 1","Your accomplishments and the strengths behind them, then failures and missed opportunities.",[
      {k:"wins",type:"table",label:"Top accomplishments",cols:["Accomplishment","Key strengths behind it"],rows:5},
      {k:"fails",type:"table",label:"Top failures",cols:["Failure","Opportunity that was missing"],rows:5}]),
    T("ex2","Others’ perspective (360°)","Exercise 2","Rate yourself, then enter each group’s average (1–5) to see the gap.",[
      {k:"rows",type:"table",rows:15,rowLabels:["Clear and effective communication","Actively listens","Approachable, easy to collaborate with","Gives constructive feedback","Receives feedback openly","Accountable and reliable","Handles stress and setbacks","Builds trust","Shows empathy","Encourages teamwork and growth","Problem-solving and decisions","Growth mindset","Leadership presence","Balances tasks and relationships","Ethics and integrity"],
        cols:[{name:"Self",num:1},{name:"Manager",num:1},{name:"Peers",num:1},{name:"Customers",num:1},{name:"Team",num:1}],computeLabel:"Others · gap",
        compute:r=>{const s=num(r[0]); const o=[1,2,3,4].map(i=>num(r[i])).filter(Number.isFinite); if(!o.length) return ""; const av=o.reduce((a,b)=>a+b,0)/o.length; if(!Number.isFinite(s)) return av.toFixed(1); const g=s-av; return `${av.toFixed(1)} · ${g>0?"+":""}${g.toFixed(1)}`;}},
      {k:"admire",type:"textarea",label:"One strength people admire most in me"},
      {k:"improve",type:"textarea",label:"One area where I could improve"}],
      "Send the survey via Google Forms or Microsoft Forms. More inputs give better insight; a positive gap means you rate yourself higher than others do."),
    T("ex3","Personality tests and synthesis","Exercise 3","Take free tests from 4–5 sources, then synthesise across exercises 1–3.",[
      {k:"tests",type:"table",label:"Tests taken",cols:["Test","Result or type","Key insight"],rows:5},
      {k:"strengths",type:"table",label:"Key strengths",cols:["Strength","How to polish it (3 small actions)"],rows:5},
      {k:"weak",type:"table",label:"Key weaknesses",cols:["Weakness","How to overcome it (3 small actions)"],rows:5}],
      "Free options include 16Personalities, HIGH5, Truity, IDRlabs and OpenPsychometrics. Keep strengths that appear in at least two exercises.")
   ]},
   {name:"Business and strategy", tools:[
    T("ex4","Business acumen","Exercise 4","Answer each question about your business.",[
      ...["What are the top 3 strategic goals of my company this year?","How does my company make money?","What are my company’s unique strategies against competitors?","Who are our key customers, and what problems do we solve?","Who are our top competitors, and how do we differentiate?","What are the biggest risks or challenges right now?","How does my role impact the company’s goals and finances?","What do revenue, margin, profit, ROI and cash flow mean for us?","How do departments work together to deliver results?","What industry trends could impact us in 1–3 years?","Could I confidently brief a leader on our biggest priorities?","What don’t I understand yet about my company, but should?","Who can I connect with to learn more?","What’s one step this week to build my business knowledge?"].map((q,i)=>({k:"q"+i,type:"textarea",label:q})),
      {k:"conf",type:"choice",label:"How many could you answer confidently?",options:["More than half","About half","Fewer than half"]}]),
    T("ex5","Connect today’s work to tomorrow","Exercise 5","For your top 5 tasks: value now, trends ahead, and what to start today.",[

const FIELD_TYPES = {
  text:"Single-line answer", textarea:"Multi-line answer", preview:"Live sentence built from a template, e.g. \"I will {action} for {duration}\"",
  checklist:"Tick boxes; options[], custom = number of free-text slots", table:"Grid; cols[] (string or {name, opts[], num}), rows, rowLabels[], compute, footer",
  list:"Numbered or prefixed list; count, numbered, prefix", choice:"Single choice pills; options[]", ratelist:"Rate each of items[] with options[]",
  score:"Self-assessment; max, items[] or sections[{name, items[]}], mode (\"total\"|\"avg\"), bands[[min, label, advice]], flagBelow",
  ab:"Pick A or B for each of pairs[[A, B]]; counts B answers", sliders:"1–10 slider for each of items[]", roi:"ROI calculator (gain, primary and indirect costs)"};
const FORMULA_OK = /^[c0-9+\-*/(). ]+$/;

function makeCompute(c){
  if (c.op === "formula"){ const fn = new Function("c", "return " + c.expr.replace(/c(\d+)/g, "c[$1]"));
    return r => { const v = (r||[]).map(num); if (!(c.expr.match(/c\d+/g)||[]).every(x => Number.isFinite(v[+x.slice(1)]))) return ""; const out = fn(v); return Number.isFinite(out) ? out.toFixed(c.decimals ?? 1) + (c.suffix||"") : ""; }; }
  if (c.op === "sum" || c.op === "avg"){ return r => { const v = (c.cols||[]).map(i => num(r?.[i])).filter(Number.isFinite); if (!v.length) return ""; const s = v.reduce((a,b)=>a+b,0); return (c.op==="sum" ? s : (s/v.length).toFixed(1)) + (c.suffix||""); }; }
  if (c.op === "lookup"){ return r => { const key = (c.cols||[]).map(i => r?.[i]||"").join("|"); return c.map?.[key] || ""; }; }
  return () => "";
}
function makeFooter(f){
  return rows => { const s = rows.reduce((a,r) => a + (Number.isFinite(num(r?.[f.col])) ? num(r[f.col]) : 0), 0); if (!s) return "";
    return `${f.label||"Total"}: ${s}${f.suffix||""}${f.target!=null ? (s===f.target ? " — on target" : ` — target ${f.target}${f.suffix||""}`) : ""}`; };
}
function hydrate(spec){
  const m = JSON.parse(JSON.stringify(spec));
  m.groups.forEach(g => g.tools.forEach(t => t.fields.forEach(f => {
    if (f.type === "table"){ if (f.compute) f.compute = makeCompute(f.compute); if (f.footer) f.footer = makeFooter(f.footer); }
    if (f.type === "preview"){ const tpl = f.template || ""; const keys = (tpl.match(/\{(\w+)\}/g)||[]).map(x => x.slice(1,-1));
      f.render = a => keys.some(k => has(a[k])) ? tpl.replace(/\{(\w+)\}/g, (_,k) => has(a[k]) ? String(a[k]).trim() : "…") : (f.placeholder || "Your sentence appears here as you type."); }
  })));
  m.color ||= "#B4520A"; m.icon ||= "📘"; m.steps ||= []; m.glossary ||= []; m.time ||= "";
  const hl = spec.highlights || [];
  m.highlights = get => hl.map(h => { const tool = m.groups.flatMap(g=>g.tools).find(t=>t.id===h.tool); const f = tool?.fields.find(x=>x.k===h.field); const a = get(h.tool);
    return [h.label, f?.type==="preview" ? (keysFilled(f, a) ? f.render(a) : null) : a[h.field]]; });
  m.uploaded = true; return prepModule(m);
}
const keysFilled = (f, a) => ((f.template||"").match(/\{(\w+)\}/g)||[]).some(x => has(a[x.slice(1,-1)]));

function validateSpec(spec, raw){
  const E = [], W = [], arr = v => Array.isArray(v) && v.length;
  if (!spec || typeof spec !== "object") return {errors:["The file isn’t a JSON object."], warnings:[]};
  if (raw && raw.length > 200000) E.push("The file is over 200 KB. Split it into two modules.");
  if (!/^[a-z0-9]{2,24}$/.test(spec.id||"")) E.push("id must be 2–24 lowercase letters or digits (it’s used in links).");
  else if (BUILTIN.some(b => b.id === spec.id)) E.push(`id “${spec.id}” is taken by a built-in module. Choose another.`);
  if (!spec.title) E.push("title is required.");
  if (!spec.blurb) W.push("blurb is empty: learners see it on the catalogue card.");
  if (!arr(spec.steps)) W.push("steps is empty: add “How to proceed” guidance as [heading, detail] pairs.");
  else spec.steps.forEach((s,i) => { if (!Array.isArray(s) || s.length !== 2) E.push(`steps[${i}] must be [heading, detail].`); });
  if (!arr(spec.glossary)) W.push("glossary is empty: key terms help learners most.");
  else spec.glossary.forEach((s,i) => { if (!Array.isArray(s) || s.length !== 2) E.push(`glossary[${i}] must be [term, definition].`); });
  if (spec.color && !/^#[0-9a-fA-F]{6}$/.test(spec.color)) E.push("color must be a hex value like #0E7A6E.");
  if (!arr(spec.groups)) { E.push("groups must contain at least one group of tools."); return {errors:E, warnings:W}; }
  const toolIds = new Set(); let toolCount = 0;
  spec.groups.forEach((g, gi) => {
    if (!g.name) E.push(`groups[${gi}] needs a name.`);
    if (!arr(g.tools)) { E.push(`Group “${g.name||gi}” has no tools.`); return; }
    g.tools.forEach((t, ti) => {
      toolCount++; const where = `Tool “${t.title || t.id || ti}”`;
      if (!/^[a-z0-9]{1,24}$/.test(t.id||"")) E.push(`${where}: id must be lowercase letters or digits.`);
      else if (toolIds.has(t.id)) E.push(`${where}: id “${t.id}” is used twice.`); else toolIds.add(t.id);
      if (!t.title) E.push(`${where}: title is required.`);
      if (!arr(t.fields)) { E.push(`${where}: needs at least one field.`); return; }
      const ks = new Set();
      t.fields.forEach((f, fi) => {
        const at = `${where}, field ${fi+1}`;
        if (!f.k) E.push(`${at}: k (field key) is required.`); else if (ks.has(f.k)) E.push(`${at}: key “${f.k}” is used twice.`); else ks.add(f.k);
        if (!FIELD_TYPES[f.type]) { E.push(`${at}: unknown type “${f.type}”. Use one of ${Object.keys(FIELD_TYPES).join(", ")}.`); return; }
        const need = (cond, msg) => { if (!cond) E.push(`${at} (${f.type}): ${msg}`); };
        if (["text","textarea","list","choice"].includes(f.type)) need(f.label, "label is required.");
        if (f.type === "checklist") need(arr(f.options), "options[] is required.");
        if (f.type === "choice") need(arr(f.options), "options[] is required.");
        if (f.type === "ratelist") { need(arr(f.items), "items[] is required."); need(arr(f.options), "options[] is required."); }
        if (f.type === "sliders") need(arr(f.items), "items[] is required.");
        if (f.type === "list") need(f.count > 0 && f.count <= 30, "count must be 1–30.");
        if (f.type === "ab") need(arr(f.pairs) && f.pairs.every(p => Array.isArray(p) && p.length === 2), "pairs must be [[A, B], …].");
        if (f.type === "preview") need(/\{\w+\}/.test(f.template||""), "template must reference at least one {fieldKey}.");
        if (f.type === "score") { need(f.max >= 2 && f.max <= 10, "max must be 2–10."); need(arr(f.items) || (arr(f.sections) && f.sections.every(s => arr(s.items))), "items[] or sections[{name, items[]}] is required.");
          if (f.bands) need(Array.isArray(f.bands) && f.bands.every(b => Array.isArray(b) && b.length >= 2), "bands must be [[minScore, label, advice], …] from highest to lowest."); }
        if (f.type === "table") { need(arr(f.cols), "cols[] is required."); need(f.rows > 0 && f.rows <= 40, "rows must be 1–40.");
          if (f.rowLabels) need(f.rowLabels.length === f.rows, "rowLabels must have one label per row.");
          if (f.compute) { need(["formula","sum","avg","lookup"].includes(f.compute.op), "compute.op must be formula, sum, avg or lookup.");
            if (f.compute.op === "formula") need(FORMULA_OK.test(f.compute.expr||""), "compute.expr may only use c0, c1… numbers and + - * / ( ).");
            need(f.computeLabel, "computeLabel is required when compute is set."); } }
      });
    });
  });
  if (spec.highlights) spec.highlights.forEach((h,i) => { if (!toolIds.has(h.tool)) E.push(`highlights[${i}] points to unknown tool “${h.tool}”.`); });
  return {errors:E, warnings:W, toolCount};
}

const hexEncode = s => Array.from(new TextEncoder().encode(s), b => b.toString(16).padStart(2,"0")).join("");
const hexDecode = h => new TextDecoder().decode(new Uint8Array(h.match(/../g).map(x => parseInt(x,16))));
function makeToken(email, minutes, invitedBy, role){
  return hexEncode(JSON.stringify({e:email.toLowerCase(), x:Date.now()+minutes*60000, n:Math.random().toString(36).slice(2,10), i:invitedBy||null, r:role||"learner"}));
}
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const usedTokens = () => { try { return JSON.parse(localStorage.getItem(LS + "::used")||"[]"); } catch(e){ return []; } };

function setHash(h){ try { history.replaceState(null, "", h); } catch(e){ location.hash = h; } }
function authShell(inner){
  document.body.classList.add("auth");
  main().innerHTML = `<section class="wrap auth-wrap"><div class="auth-split">
    <div class="auth-brand"><p class="eyebrow">Welcome to Learning Lab</p>
      <h1>Your workbooks, saved and tracked</h1>
      <ul class="auth-points"><li>Work through interactive workbooks at your own pace</li><li>Every answer saves as you type, on any device</li><li>Download a brief of everything you’ve written</li></ul>
      <p class="hint">No password. We email you a link that signs you in.</p></div>
    <div class="card auth-card">${inner}</div></div></section>`;
}
function viewSignin(sent, mode){
  mode ||= sent?.mode || "learner";
  if (sent){
    authShell(`<p class="eyebrow">Sign in</p><h2>Check your inbox</h2>
      <p>We sent a sign-in link to <b>${esc(sent.email)}</b>. It works once and expires in 15 minutes.</p>
      <p class="hint">Open the link on this device. Check your spam folder if it doesn’t arrive within a minute.</p>
      <button class="btn ghost" id="backBtn">Use a different email</button>`);
    backBtn.onclick = () => viewSignin(null, mode); return;
  }
  authShell(`<h2>Sign in</h2>
    <p class="hint">Enter your email and we’ll send you a one-time sign-in link. New here? The same link creates your account.</p>
    <form id="signinForm" onsubmit="return false"><div class="field"><label for="sEmail">Email</label><input type="text" inputmode="email" autocomplete="email" id="sEmail" placeholder="you@company.com"></div>
      <p class="err" id="sErr" role="alert"></p><button class="btn primary wide" id="sSend">Email me a sign-in link</button></form>
`);
  sSend.onclick = async () => { const e = sEmail.value.trim(); if (!validEmail(e)){ sErr.textContent = "Enter a valid email address, like name@company.com."; sEmail.focus(); return; }
    sSend.disabled = true; sErr.textContent = "";
    try { await FB.sendLink(e); track("signin_link_requested", {method:"signin"}); viewSignin({email:e, mode:"learner", sent:true}); }
    catch(err){ console.error(err); sSend.disabled = false; sErr.textContent = "We couldn’t send the link. Try again in a minute."; } };
  sEmail.addEventListener("keydown", e => { if (e.key === "Enter") sSend.click(); });
}
function handleAuth(hex){
  setHash("#signin"); return viewSignin(); /* unsigned prototype links are disabled in production */
  let t = null; try { t = JSON.parse(hexDecode(hex)); } catch(e){}
  const fail = msg => { authShell(`<h2>This link doesn’t work</h2><p>${msg}</p><button class="btn primary" id="newLink">Send a new link</button>`); newLink.onclick = () => { setHash("#signin"); viewSignin(); }; };
  if (!t || !validEmail(t.e||"")) return fail("The link is incomplete. Copy the whole link from the email, or request a new one.");
  if (Date.now() > t.x) return fail("The link has expired. Sign-in links last 15 minutes and invitations last 7 days.");
  if (usedTokens().includes(t.n)) return fail("This link has already been used. Each link signs you in once.");
  try { localStorage.setItem(LS + "::used", JSON.stringify([...usedTokens(), t.n].slice(-200))); } catch(e){}
  signInAs(t.e, t.i ? "invite" : "magic-link", t.r);
}
async function signInAs(email, method, role){
  switchLocalUser(email);
  S.session = {email, method, role:role||"learner", signedInAt:new Date().toISOString()};
  if (S.profile) S.profile.email = email;
  let msg = `Signed in as ${email}`;
  if (role === "admin"){
    if (runtime === "claude"){ if (!isAdmin) msg = "This account doesn’t have admin access, so you’re signed in as a learner."; }
    else { localStorage.setItem(LS_ADMIN + "::demo", "1"); isAdmin = true; }
  } else if (runtime === "local"){ localStorage.setItem(LS_ADMIN + "::demo", "0"); isAdmin = false; }
  persistProfile(); toast(msg);

function switchLocalUser(email){

/* one write at a time per doc, coalesced */
const pending = {}, busy = {};
function queueWrite(docName, payloadFn){
  pending[docName] = payloadFn;
  if (busy[docName]) return;
  busy[docName] = true;
  setTimeout(async function run(){
    const fn = pending[docName]; delete pending[docName];
    if (fn && remote.db && remote.uid){
      try { await remote.db.doc(docName === "progress" ? "progress/" + remote.uid : "users/" + remote.uid + "/data/" + docName).set(fn()); setStatus("synced"); }
      catch(e){ setStatus("error"); }
    }
    if (pending[docName]) setTimeout(run, 600); else busy[docName] = false;
  }, 800);
}
function persistProfile(){ saveLocal(); queueWrite("profile", () => ({session:S.session, profile:S.profile, enrolled:S.enrolled, log:S.log.slice(0,60), savedAt:S.savedAt}));
  if (S.profile) queueWrite("progress", () => ({...progressSummary(), workbooks:Object.keys(S.enrolled).length, name:S.profile.name})); }
function persistModule(mid){ saveLocal(); queueWrite("m-" + mid, () => ({answers:S.answers[mid]||{}, updated:S.updated[mid]||{}, savedAt:S.savedAt})); }

function setStatus(s){
  remote.status = s;
  const el = document.getElementById("syncStatus"); if (!el) return;
  el.textContent = s==="synced" ? "Saved to your account" : s==="error" ? "Couldn’t sync, saved in this browser" : s==="loading" ? "Connecting…" : "Saved in this browser";

}

async function connect(){
  if (!window.FB) return localMode();

    const user = await FB.ready;
    if (!user){ S.session = null; runtime = "claude"; isAdmin = false; remote.db = null; setStatus("local"); route(); return; }
    const uid = await FB.user.id();
    remote.db = FB.db; remote.uid = uid; remote.user = FB.user; runtime = "claude";
    try { isAdmin = await FB.user.canEdit(); } catch(e){ isAdmin = false; }
    if (S.session?.email !== user.email){ switchLocalUser(user.email); S.session = {email:user.email, method:"magic-link", role:isAdmin?"admin":"learner", signedInAt:new Date().toISOString()}; if (S.profile) S.profile.email = user.email; saveLocal(); }
    const db = remote.db;
    try { posthog.identify(uid); } catch(e){}
    if (!sessionStorage.getItem("ll-ph-signin")){ try { sessionStorage.setItem("ll-ph-signin","1"); } catch(e){} track("signin_completed", {method:"signin"}); }
    await loadShared();
    const col = db.collection("users/" + uid + "/data");
    const p = await col.doc("profile").get();
    if (p.exists){
      const d = p.data();
      if (!S.savedAt || (d.savedAt && d.savedAt > S.savedAt)){
        S.profile = d.profile || S.profile; S.enrolled = d.enrolled || {}; S.log = d.log || [];
        for (const mid of Object.keys(S.enrolled)){

    }
    setStatus("synced"); route();
  } catch(e){ localMode(); }
}
let suggestedName = "";

/* ===================== PROGRESS ===================== */
const counted = t => t.fields.filter(f => f.type !== "preview");
function fieldFilled(f, v){
  switch(f.type){
    case "checklist": return v && ((v.checked||[]).length || (v.custom||[]).some(has));
    case "table": return Array.isArray(v) && v.some(r => r && r.some(has));
    case "list": return Array.isArray(v) && v.some(has);
    case "ratelist": case "sliders": case "score": case "ab": return v && Object.keys(v).length > 0;
    case "roi": return v && (has(v.gain)||has(v.primary));
    default: return has(v);
  }
}
function toolStatus(mid, t){
  const a = A(mid, t.id), fs = counted(t), n = fs.filter(f => fieldFilled(f, a[f.k])).length;
  return n === 0 ? "" : n === fs.length ? "done" : "part";
}
function modProgress(m){
  const st = m.tools.map(t => toolStatus(m.id, t));
  const done = st.filter(s=>s==="done").length, started = st.filter(Boolean).length;
  const pct = Math.round((st.reduce((a,s)=>a+(s==="done"?1:s==="part"?.5:0),0) / m.tools.length) * 100);
  return {done, started, total:m.tools.length, pct};
}

/* ===================== FIELD RENDERING ===================== */
const flat = f => f.sections ? f.sections.flatMap(x=>x.items) : f.items;

function scoreOf(f, v){
  v = v || {}; const N = flat(f).length, vals = Object.values(v).map(Number), n = vals.length, total = vals.reduce((a,b)=>a+b,0);
  const metric = f.mode==="avg" ? (n?total/n:0) : total, complete = n===N;
  const band = complete && f.bands ? f.bands.find(b=>metric>=b[0]) : null;
  const disp = !n ? "–" : f.mode==="avg" ? `${metric.toFixed(1)}/${f.max}` : `${total}/${N*f.max}`;
  return {N,n,total,complete,band,disp,low:f.flagBelow && vals.some(x=>x<f.flagBelow)};
}
function scoreHtml(f, v){
  const s = scoreOf(f,v);
  return `<b>${s.disp}</b><div><strong>${s.complete?(s.band?.[1]||"Complete"):`${s.n} of ${s.N} answered`}</strong>${s.band?`<br><span class="hint">${esc(s.band[2])}</span>`:""}${s.low?`<br><span class="hint">At least one answer is below ${f.flagBelow}: a signal to reignite.</span>`:""}</div>`;
}
const emsLabel = b => b>=8 ? "Strongly experimental" : b>=5 ? "Leaning experimental" : b>=3 ? "Leaning certainty-seeking" : "Strongly certainty-seeking";

function roiCalc(v){ const g=num(v?.gain), p=num(v?.primary)||0, i=num(v?.indirect)||0, c=p+i; if (!Number.isFinite(g) || !(c>0)) return null; return {g,p,i,c,roi:(g-c)/c*100}; }
const fmtN = n => n.toLocaleString(undefined,{maximumFractionDigits:0});
function roiHtml(v){ const r = roiCalc(v);

function onInput(e){
  const el = e.target, sheet = el.closest("[data-tool]"); if (!sheet || !el.dataset.k) return;
  const mid = sheet.dataset.mid, tid = sheet.dataset.tool, m = MOD(mid), t = m.tools.find(x=>x.id===tid), f = t.fields.find(x=>x.k===el.dataset.k), a = A(mid, tid);
  const out = document.getElementById(`out-${tid}-${f.k}`);
  switch(f.type){
    case "checklist": { const v = a[f.k] ||= {checked:[],custom:[]}; v.checked ||= []; v.custom ||= [];
      if (el.dataset.check !== undefined){ const o = f.options[+el.dataset.check]; v.checked = el.checked ? [...new Set([...v.checked,o])] : v.checked.filter(x=>x!==o); }
      else v.custom[+el.dataset.custom] = el.value; break; }
    case "table": { const v = a[f.k] ||= []; const r = +el.dataset.r; (v[r] ||= [])[+el.dataset.c] = el.value;
      if (f.compute){ const c = sheet.querySelector(`[data-comp="${f.k}-${r}"]`); if (c) c.textContent = f.compute(v[r]); }
      if (f.footer){ const ft = document.getElementById(`foot-${tid}-${f.k}`); if (ft) ft.textContent = f.footer(v); } break; }
    case "list": (a[f.k] ||= [])[+el.dataset.i] = el.value; break;
    case "ratelist": (a[f.k] ||= {})[el.dataset.i] = el.value; break;
    case "score": (a[f.k] ||= {})[el.dataset.i] = +el.value; if (out) out.innerHTML = scoreHtml(f, a[f.k]); break;
    case "ab": (a[f.k] ||= {})[el.dataset.i] = el.value; if (out) out.innerHTML = abHtml(a[f.k]); break;
    case "sliders": (a[f.k] ||= {})[el.dataset.i] = +el.value; el.nextElementSibling.textContent = el.value; break;
    case "roi": (a[f.k] ||= {})[el.dataset.sub] = el.value; if (out) out.innerHTML = roiHtml(a[f.k]); break;
    default: a[f.k] = el.value;
  }
  t.fields.filter(x=>x.type==="preview").forEach(p => { const n = document.getElementById(`pv-${tid}-${p.k}`); if (n) n.textContent = p.render(a); });
  const now = new Date().toISOString();
  (S.updated[mid] ||= {})[tid] = now;
  if (S.enrolled[mid]) S.enrolled[mid].last = tid;
  if (!(S.log[0] && S.log[0].mid===mid && S.log[0].tid===tid)) S.log.unshift({t:now, mid, tid}); else S.log[0].t = now;
  S.log = S.log.slice(0,60);
  clearTimeout(onInput.timer);
  onInput.timer = setTimeout(()=>{ persistModule(mid); persistProfile(); refreshToolChrome(mid, tid); }, 400);
}
const seenStatus = {};
function trackProgress(mid, tid, status, p){
  if (status && seenStatus[mid+"/"+tid] !== status){ seenStatus[mid+"/"+tid] = status; track("tool_answered", {module_id:mid, tool_id:tid, status: status==="done"?"done":"started"}); }
  if (p.total && p.done === p.total){ let flag = "ll-completed-" + mid, was = null; try { was = localStorage.getItem(flag); } catch(e){}
    if (!was){ try { localStorage.setItem(flag,"1"); } catch(e){} track("module_completed", {module_id:mid, days_since_enrolled: S.enrolled[mid] ? Math.floor((Date.now()-Date.parse(S.enrolled[mid].added))/864e5) : null}); } }
}
function refreshToolChrome(mid, tid){
  const s = document.getElementById("savedNote"); if (s) s.textContent = "Saved " + fmtTime(S.updated[mid]?.[tid]);
  const m = MOD(mid), t = m.tools.find(x=>x.id===tid);
  const dot = document.querySelector(`[data-go-tool="${tid}"] .dot`); if (dot) dot.className = "dot " + toolStatus(mid, t);
  const p = modProgress(m), bar = document.getElementById("modBar"), txt = document.getElementById("modPct");
  if (bar) bar.style.width = p.pct + "%"; if (txt) txt.textContent = `${p.pct}% · ${p.done} of ${p.total} tools complete`;
  trackProgress(mid, tid, toolStatus(mid, t), p);
}

const main = () => document.getElementById("main");
function go(hash){ if (location.hash === hash) route(); else location.hash = hash; }
window.addEventListener("hashchange", route);

function route(){ try { routeInner(); } catch(err){ console.error(err); main().innerHTML = `<section class="wrap"><div class="card empty-card"><h1>Something went wrong</h1><p>This page couldn’t load. Your answers are saved.</p><button class="btn primary" onclick="location.hash='#dashboard'">Go to my learning</button></div></section>`; } }
function routeInner(){
  const raw = location.hash.slice(1);
  if (raw.startsWith("auth-")) return handleAuth(raw.slice(5));
  document.body.classList.remove("auth");
  if (S.session && Date.now() - Date.parse(S.session.signedInAt) > 30 * 864e5){ S.session = null; saveLocal(); }
  if (!S.session){ if (raw !== "signin") setHash("#signin"); return viewSignin(); }
  if (raw === "signin") return go(S.profile ? "#dashboard" : "#profile");
  const h = raw || (S.profile ? "dashboard" : "profile");
  if (!S.profile && h !== "profile") return go("#profile");
  const an = document.getElementById("adminNav"); if (an) an.hidden = !isAdmin;
  const [view, a, b] = h.split("/");
  document.querySelectorAll("[data-nav]").forEach(n => n.setAttribute("aria-current", n.dataset.nav === view ? "page" : "false"));
  const av = document.getElementById("avatarBtn"); av.textContent = (S.profile?.name || "?").trim().charAt(0).toUpperCase() || "?";
  if (view === "profile") viewProfile();
  else if (view === "catalog") viewCatalog();
  else if (view === "journey") viewJourney();
  else if (view === "admin") viewAdmin(a);
  else if (view === "m" && MOD(a)) viewModule(MOD(a), b);
  else viewDashboard();
  window.scrollTo({top:0});
  track("$pageview", {view, module_id: view === "m" ? a : undefined, tool_id: view === "m" ? b : undefined});
}

  return `<div class="card"><p class="eyebrow">About this workbook</p><p class="lead">${esc(m.blurb)}</p><p class="meta-line">${esc(m.time)}</p></div>
    <div class="card"><h2>How to proceed</h2><ol class="steps">${m.steps.map(([h,d])=>`<li><b>${esc(h)}</b><span>${esc(d)}</span></li>`).join("")}</ol>
    <div class="howto"><p><b>Tracking your progress.</b> Each tool’s dot fills as you answer: half for started, full when every field has an answer. Answers save automatically and every save is logged on your dashboard.</p>
    <p><b>Your brief.</b> Everything you write is compiled into a brief you can copy, download or print at any time.</p></div>
    <button class="btn primary" onclick="go('#m/${m.id}/${first.id}')">${modProgress(m).started?"Continue with":"Start with"}: ${esc(first.title)}</button></div>
    ${glossaryHtml(m, true)}`;
}
function renderTool(m, t, box){
  const i = m.tools.indexOf(t), enrolled = !!S.enrolled[m.id];
  box.innerHTML = `<article class="card sheet" data-tool="${t.id}" data-mid="${m.id}">
    <div class="meta"><span>${esc(t.group)} · ${i+1} of ${m.tools.length}</span><span><span class="saved" id="savedNote">${S.updated[m.id]?.[t.id]?"Saved "+fmtTime(S.updated[m.id][t.id]):""}</span> <span class="ref">${esc(t.ref)}</span></span></div>
    <h2 class="tool-title">${esc(t.title)}</h2><p class="intro">${esc(t.intro)}</p>
    ${t.tip?`<div class="tip"><b>Guidance</b><p>${esc(t.tip)}</p></div>`:""}
    <form onsubmit="return false" ${enrolled?"":'class="locked"'}>${t.fields.map(f=>renderField(m.id,t,f)).join("")}</form>
    <div class="pager"><button class="btn ghost" ${i===0?"disabled":""} onclick="go('#m/${m.id}/${m.tools[i-1]?.id}')">Previous</button>
      <button class="btn primary" onclick="go('#m/${m.id}/${i===m.tools.length-1?"brief":m.tools[i+1].id}')">${i===m.tools.length-1?"Open my brief":"Next: "+esc(m.tools[i+1].title)}</button></div>
  </article>${glossaryHtml(m, false)}`;
  if (!enrolled){
    box.querySelectorAll("form input, form textarea, form select").forEach(el => el.disabled = true);
  }
}
document.addEventListener("toggle", e => { const d = e.target; if (d.classList?.contains("glossary") && d.open){ const sheet = document.querySelector("[data-mid]"); const m = (location.hash.match(/^#m\/([^/]+)/)||[])[1];
  track("glossary_opened", {module_id:m, from: sheet ? "tool" : "overview"}); } }, true);
document.addEventListener("input", e => { if (e.target.closest("[data-tool] form")) onInput(e); });
document.addEventListener("change", e => { if ((e.target.type==="checkbox"||e.target.type==="radio") && e.target.closest("[data-tool] form")) onInput(e); });

/* ---------- Brief ---------- */
function briefData(m){
  return m.groups.map(g => ({name:g.name, tools:g.tools.map(t => {
    const a = A(m.id, t.id), items = [];
    for (const f of counted(t)){
      const v = a[f.k]; if (!fieldFilled(f, v)) continue;
      switch(f.type){
        case "checklist": items.push({kind:"list", q:f.label||null, items:[...(v.checked||[]),...(v.custom||[]).filter(has)]}); break;
        case "table": { const cols = colsOf(f).map(c=>c.name);
          items.push({kind:"table", q:f.label||null, cols:(f.rowLabels?[""]:[]).concat(cols, f.compute?[f.computeLabel]:[]),
            rows:v.map((r,i)=> r && r.some(has) ? (f.rowLabels?[f.rowLabels[i]]:[]).concat(cols.map((_,c)=>r[c]||""), f.compute?[f.compute(r)]:[]) : null).filter(Boolean)});
          if (f.footer && f.footer(v)) items.push({kind:"text", q:null, a:f.footer(v)}); break; }
        case "list": items.push({kind:"list", q:f.label, items:v.filter(has).map(x=>f.prefix?`${f.prefix} ${x}`:x)}); break;
        case "ratelist": items.push({kind:"table", q:f.label||null, cols:["","Rating"], rows:f.items.map((it,i)=>v[i]?[it,v[i]]:null).filter(Boolean)}); break;
        case "sliders": items.push({kind:"bars", max:10, items:f.items.map((it,i)=>[it, v[i]??null]).filter(x=>x[1]!==null)}); break;
        case "score": { const sc = scoreOf(f,v); items.push({kind:"text", q:"Result", a:`${sc.disp}${sc.complete&&sc.band?` — ${sc.band[1]}. ${sc.band[2]}`:sc.complete?"":` (${sc.n} of ${sc.N} answered)`}`}); break; }
        case "ab": { const b = Object.values(v).filter(x=>x==="B").length, lean = f.pairs.map((p,i)=>v[i]==="A"?p[0]:null).filter(Boolean);
          items.push({kind:"text", q:"Experimental Mindset Scale", a:`${b}/10 — ${emsLabel(b)}`}); if (lean.length) items.push({kind:"list", q:"Where I still lean toward certainty", items:lean}); break; }
        case "roi": { const r = roiCalc(v); items.push({kind:"text", q:"Return on investment", a:r?`${r.roi.toFixed(0)}% — gain ${fmtN(r.g)} against ${fmtN(r.c)} total cost`:"Incomplete"}); break; }
        default: items.push({kind:"text", q:f.label, a:v});
      }
    }
    return items.length ? {t, items, updated:S.updated[m.id]?.[t.id]} : null;
  }).filter(Boolean)}));
}
function scorecard(m){
  const rows = [];
  for (const t of m.tools) for (const f of t.fields){
    if (f.type==="score"){ const sc = scoreOf(f, A(m.id,t.id)[f.k]); if (sc.n) rows.push([t.title, sc.disp, sc.complete?(sc.band?.[1]||"Complete"):`${sc.n} of ${sc.N} answered`]); }
    if (f.type==="ab"){ const v = A(m.id,t.id)[f.k]||{}, n = Object.keys(v).length; if (n){ const b = Object.values(v).filter(x=>x==="B").length; rows.push([t.title, `${b}/10`, n<10?`${n} of 10 answered`:emsLabel(b)]); } }
  }
  return rows;
}
function briefHtml(m){
  const data = briefData(m), p = modProgress(m), sc = scorecard(m), hl = (m.highlights ? m.highlights(tid=>A(m.id,tid)) : []).filter(x=>has(x[1]));
  const body = data.map(sec => !sec.tools.length ? "" : `<h3 class="bsec">${esc(sec.name)}</h3>` + sec.tools.map(({t,items,updated}) =>
    `<h4>${esc(t.title)} <span class="hint">· logged ${fmtTime(updated)}</span></h4>` + items.map(it => {
      if (it.kind==="text") return `${it.q?`<p class="q">${esc(it.q)}</p>`:""}<p class="a">${esc(it.a)}</p>`;
      if (it.kind==="list") return `${it.q?`<p class="q">${esc(it.q)}</p>`:""}<ul>${it.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
      if (it.kind==="table") return `${it.q?`<p class="q">${esc(it.q)}</p>`:""}<div class="tbl-wrap"><table class="btable"><thead><tr>${it.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${it.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
      if (it.kind==="bars") return `<div class="bars">${it.items.map(([l,n])=>`<div class="bar-row"><span>${esc(l)}</span><i><span style="width:${n/it.max*100}%"></span></i><b>${n}</b></div>`).join("")}</div>`;
    }).join("")).join("")).join("");
  return `<article class="card sheet brief"><div class="meta"><span>Compiled from your answers</span><span>${new Date().toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})}</span></div>
    <h2 class="tool-title">${esc(m.title)} brief</h2><p class="intro">${esc(S.profile.name)}${S.profile.role?` · ${esc(S.profile.role)}`:""} · ${p.started} of ${p.total} tools contribute to this brief.</p>
    <div class="actions noprint"><button class="btn primary" id="copyMd">Copy as text</button><button class="btn ghost" id="dlMd">Download .md</button><button class="btn ghost" id="printBrief">Print or save PDF</button></div>
    ${hl.map(([l,v])=>`<p class="q">${esc(l)}</p><p class="statement">${esc(v)}</p>`).join("")}
    ${sc.length?`<p class="q">Scorecard</p><div class="tbl-wrap"><table class="btable"><thead><tr><th>Exercise</th><th>Score</th><th>Level</th></tr></thead><tbody>${sc.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}
    ${body || `<p class="hint">Nothing logged yet. Start with the first tool and your answers will appear here.</p>`}</article>`;
}
function wireBrief(m){
  copyMd.onclick = async () => { try { await navigator.clipboard.writeText(toMarkdown(m)); track("brief_exported", {module_id:m.id, format:"copy"}); toast("Brief copied"); } catch(e){ toast("Copy isn’t available here. Use Download .md instead."); } };
  dlMd.onclick = () => { track("brief_exported", {module_id:m.id, format:"md"}); download(`${m.id}-brief.md`, toMarkdown(m), "text/markdown"); };
  const pr = document.getElementById("printBrief"); if (pr) pr.onclick = () => { track("brief_exported", {module_id:m.id, format:"print"}); window.print(); };
}
function toMarkdown(m){
  const L = [`# ${m.title} — brief`, `_${S.profile?.name||""}${S.profile?.role?`, ${S.profile.role}`:""} · ${new Date().toLocaleDateString()}_`, ""];
  (m.highlights ? m.highlights(tid=>A(m.id,tid)) : []).filter(x=>has(x[1])).forEach(([l,v])=>L.push(`**${l}:** ${v}`, ""));
  const sc = scorecard(m); if (sc.length){ L.push("## Scorecard","","| Exercise | Score | Level |","| --- | --- | --- |"); sc.forEach(r=>L.push(`| ${r.join(" | ")} |`)); L.push(""); }
  const cell = c => String(c).replace(/\|/g,"/").replace(/\n/g," ");
  for (const sec of briefData(m)){ if (!sec.tools.length) continue; L.push(`## ${sec.name}`, "");
    for (const {t,items,updated} of sec.tools){ L.push(`### ${t.title}`, `_Logged ${fmtTime(updated)}_`, "");
      for (const it of items){
        if (it.kind==="text"){ if (it.q) L.push(`**${it.q}**`); L.push(String(it.a), ""); }
        if (it.kind==="list"){ if (it.q) L.push(`**${it.q}**`); it.items.forEach(x=>L.push("- "+x)); L.push(""); }
        if (it.kind==="table"){ if (it.q) L.push(`**${it.q}**`); L.push("| "+it.cols.map(cell).join(" | ")+" |", "|"+it.cols.map(()=>" --- ").join("|")+"|"); it.rows.forEach(r=>L.push("| "+r.map(cell).join(" | ")+" |")); L.push(""); }
        if (it.kind==="bars"){ it.items.forEach(([l,n])=>L.push(`- ${l}: ${n}/${it.max}`)); L.push(""); }
      } } }
  return L.join("\n");
}

/* ===================== UTILITIES ===================== */
function download(name, text, type){ const blob = new Blob([text],{type}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000); }
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("show"), 2200); }

document.addEventListener("DOMContentLoaded", () => { rebuildCatalog(); isAdmin = false; route(); connect(); });
</script></body></html>
